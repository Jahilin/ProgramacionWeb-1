<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,
    initial-scale=1.0">
    <title>Horarios y Promociones | Supermercado El Ahorro</title>
</head>
<body>
    <header>
        <h1>🛒 Supermercado El Ahorro</h1>
        <p>Cronograma Semanal de Cobertura y Descuentos Especiales 2026</p>
    </header>
    <main>
        <h2>Formulario de Afiliacion de Clientes</h2>
        <form action="afiliados.php", method="POST" enctype="multipart/form-data">
            <fieldset>
                <legend>Datos Personales</legend>
                <div>
                    <label>Ingrese su nombre</label>
                    <input type="text" name="nombre" id="nombre"
                    required placeholder="Ingrese su nombre y apellido"
                    minlength="10" maxlength="100">
                </div>
                <div>
                    <label>Ingrese su DNI</label>
                    <input type="text" name="DNI" id="DNI"
                    required placeholder="Ingrese su numero de identidad"
                    minlength="13" maxlength="13" required pattern="[0-9]{4}-[0-9]{4}-[0-9]{5}">
                </div>
                 <div>
                    <label>Ingrese su numero de telefono</label>
                    <input type="text" name="telefono" id="telefono"
                    required placeholder="Ingrese su numero de telefono"
                    minlength="11" maxlength="11">
                </div>
                 <div>
                    <label>Ingrese su fecha de nacimiento</label>
                    <input type="text" name="fechaNacimiento" id="fechaNacimiento"
                    required placeholder="Ingrese su fecha de nacimiento"
                    min="1945-01-01" max="2008-01-01">
                </div>
                <div>
                    <label>Ingrese la direccion de su residencia</label>
                    <input type="text" name="direccion" id="direccion"
                    required placeholder="Ingrese su direccion">
                </div>
            </fieldset>
            <fieldset>
                <legend>Informacion de Compra</legend>
                <div>
                    <label>Seleccione:</label>
                </div>
                
            </fieldset>

        </form>
    </main>
</body>
